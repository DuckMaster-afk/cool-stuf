<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #3e2723; /* Dark brown background for the page */
            color: #d7ccc8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .top-bar {
            width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .back-btn {
            color: #d7ccc8;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #d7ccc8;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .back-btn:hover {
            background-color: #d7ccc8;
            color: #3e2723;
        }
        .score-board {
            font-size: 1.4rem;
            font-weight: bold;
        }
        canvas {
            background-color: #f5f5dc; /* Classic Beige Game Board */
            border: 6px solid #5d4037; /* Warm brown border */
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #b0bec5;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">⬅ Home</a>
        <div class="score-board">SCORE: <span id="score">000</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        Use <b>ARROW KEYS</b> or <b>WASD</b> to move.<br>
        Press any movement key to restart on Game Over.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameRunning = false;

        function main() {
            if (hasGameEnded()) {
                gameRunning = false;
                clearInterval(gameInterval);
                ctx.fillStyle = "rgba(62, 39, 35, 0.85)"; // Transparent dark brown overlay
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#d32f2f"; // Classic Game Over Red
                ctx.font = "bold 30px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "14px 'Courier New'";
                ctx.fillStyle = "#f5f5dc";
                ctx.fillText("PRESS ANY KEY TO RESTART", canvas.width / 2, canvas.height / 2 + 30);
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#f5f5dc"; // Beige screen
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#2e7d32" : "#4caf50"; // Dark green head, classic green body
                ctx.strokeStyle = "#f5f5dc"; // Grid line separation
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function drawFood() {
            ctx.fillStyle = "#d32f2f"; // Classic bright red apple
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = String(score).padStart(3, '0');
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            score = 0;
            scoreElement.innerText = "000";
            generateFood();
            gameRunning = true;
            gameInterval = setInterval(main, 100);
        }

        window.addEventListener("keydown", e => {
            const keyPressed = e.key;
            
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(keyPressed)) {
                e.preventDefault(); 
            }
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === "ArrowLeft" || keyPressed === "a") && !goingRight) {
                dx = -1; dy = 0;
                if (!gameRunning) resetGame();
            }
            if ((keyPressed === "ArrowUp" || keyPressed === "w") && !goingDown) {
                dx = 0; dy = -1;
                if (!gameRunning) resetGame();
            }
            if ((keyPressed === "ArrowRight" || keyPressed === "d") && !goingLeft) {
                dx = 1; dy = 0;
                if (!gameRunning) resetGame();
            }
            if ((keyPressed === "ArrowDown" || keyPressed === "s") && !goingUp) {
                dx = 0; dy = 1;
                if (!gameRunning) resetGame();
            }
        });

        clearCanvas();
        ctx.fillStyle = "#2e7d32";
        ctx.font = "bold 16px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("PRESS ANY DIRECTION KEY TO START", canvas.width / 2, canvas.height / 2);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Light Green Light Online</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #080810; color: #f0f0f8;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; padding: 20px;
        }
        #lobby {
            background-color: #10101c; border: 1px solid #222238; border-radius: 12px;
            padding: 30px; width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        h2 { color: #ff0055; margin-bottom: 20px; text-shadow: 0 0 10px #ff0055; }
        .btn {
            background-color: #00f0ff; color: #040406; border: none; padding: 10px 20px;
            font-size: 1rem; border-radius: 20px; cursor: pointer; font-weight: bold;
            margin: 10px 0; width: 100%; transition: all 0.2s ease;
        }
        .btn:hover { background-color: #70f8ff; box-shadow: 0 0 15px #00f0ff; }
        .btn:disabled { background-color: #333; cursor: not-allowed; box-shadow: none; color: #777; }
        input {
            width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #2d2d44;
            background-color: #161626; color: #fff; text-align: center; font-size: 1rem; margin-bottom: 10px;
        }
        #player-list {
            margin: 15px 0; background: #161626; border-radius: 8px; padding: 10px;
            text-align: left; font-size: 0.9rem; max-height: 120px; overflow-y: auto;
        }
        #status-msg { color: #8888aa; font-size: 0.9rem; margin-top: 10px; }
        #game-container { display: none; position: relative; text-align: center; }
        canvas { background-color: #0c0c16; border: 1px solid #222238; border-radius: 12px; }
        
        #hud {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; font-size: 1.1rem; font-weight: bold;
        }
        #light-indicator {
            padding: 6px 16px; border-radius: 20px; font-weight: 800; letter-spacing: 1px;
        }
        .light-green { background-color: #00e676; color: #000; box-shadow: 0 0 15px #00e676; }
        .light-red { background-color: #ff1744; color: #fff; box-shadow: 0 0 15px #ff1744; }

        /* Guard Private Control Box (Only visible to the Guard) */
        #guard-controls {
            display: none; background: #161626; border: 1px solid #333355; border-radius: 8px;
            padding: 10px; margin-top: 10px; text-align: center;
        }
        #guard-controls button {
            padding: 8px 16px; margin: 0 5px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;
        }
        .btn-green { background-color: #00e676; color: #000; }
        .btn-red { background-color: #ff1744; color: #fff; }

        #game-over-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 16, 0.95); border-radius: 12px;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>🚦 Red Light, Green Light</h2>
        
        <div id="setup-inputs">
            <input type="text" id="username-input" placeholder="Enter Username (Optional)">
            <button class="btn" id="btn-create">Create Room (Host / Guard)</button>
            <div style="margin: 10px 0; color: #444;">— OR —</div>
            <input type="text" id="room-code-input" placeholder="Enter Room Code">
            <button class="btn" id="btn-join" style="background-color: #ff0055; color: #fff;">Join Room (Sneaker)</button>
        </div>
        
        <div id="player-list-section" style="display:none; margin-top:15px;">
            <div style="font-weight:bold; color:#00f0ff;">Players connected (<span id="count">0</span>/8):</div>
            <div id="player-list"></div>
            <button class="btn" id="btn-start" style="background-color:#00e676; color:#000;" disabled>Start Match (Need 2+ Players)</button>
        </div>
        <div id="status-msg">Initializing network link...</div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div id="role-display" style="color:#00f0ff;">ROLE: SNEAKER</div>
            <div id="light-indicator" class="light-green">GREEN LIGHT</div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <!-- Guard Controls: Rendered ONLY on the Guard's screen -->
        <div id="guard-controls">
            <span style="font-size:0.9rem; color:#aaa; margin-right:10px;">GUARD CONTROLS:</span>
            <button class="btn-green" id="btn-set-green">CALL GREEN LIGHT</button>
            <button class="btn-red" id="btn-set-red">CALL RED LIGHT</button>
        </div>

        <div id="game-over-overlay">
            <h1 id="win-title" style="font-size:3rem; margin-bottom:10px; color:#00f0ff;">WINNER!</h1>
            <div style="display: flex; gap: 15px; width: 320px;">
                <button class="btn" onclick="location.reload()" style="background-color:#ff1744; color:#fff;">Back to Menu</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const lobby = document.getElementById("lobby");
const gameContainer = document.getElementById("game-container");
const playerListDiv = document.getElementById("player-list");
const statusMsg = document.getElementById("status-msg");
const btnStart = document.getElementById("btn-start");
const lightIndicator = document.getElementById("light-indicator");
const guardControls = document.getElementById("guard-controls");
const roleDisplay = document.getElementById("role-display");
const gameOverOverlay = document.getElementById("game-over-overlay");

let peer, conn, role = ""; 
let myId = "";
let myUsername = "";
let connections = []; 
let players = {};     
let gameRunning = false;
let keys = {};

// Light State & Timing
let currentLight = "GREEN"; 
let redLightStartTime = 0;
let lastLightSwitchTime = 0;
const GRACE_PERIOD_MS = 700; 
const LIGHT_COOLDOWN_MS = 1000; // 1 second cooldown for guard toggles

peer = new Peer(Math.random().toString(36).substring(2, 7).toUpperCase());
peer.on('open', id => { myId = id; statusMsg.innerText = "Network ready."; });

document.getElementById("btn-create").addEventListener("click", () => {
    if (!myId) return;
    myUsername = document.getElementById("username-input").value.trim() || "Player_" + Math.floor(Math.random()*100);
    role = "host";
    document.getElementById("setup-inputs").style.display = "none";
    document.getElementById("player-list-section").style.display = "block";
    btnStart.style.display = "block";
    statusMsg.innerHTML = `Room Code: <b style='color:#00f0ff; font-size:1.3rem;'>${myId}</b>`;
    
    players[myId] = { id: myId, name: myUsername, x: 50, y: 250, isGuard: false, score: 0, moving: false, caughtDuringRed: false };
    updateLobbyUI();

    peer.on('connection', c => {
        if (Object.keys(players).length >= 8 || gameRunning) { setTimeout(() => c.close(), 500); return; }
        c.on('open', () => {
            connections.push(c);
            c.on('data', data => handleNetworkData(data, c));
            c.send({ type: "sync", players });
        });
        c.on('close', () => {
            connections = connections.filter(conn => conn !== c);
            let leftId = Object.keys(players).find(k => players[k].peerId === c.peer);
            if(leftId) { delete players[leftId]; broadcast({type: "sync", players}); updateLobbyUI(); }
        });
    });
});

document.getElementById("btn-join").addEventListener("click", () => {
    let code = document.getElementById("room-code-input").value.trim().toUpperCase();
    if(!code) return alert("Enter room code.");
    myUsername = document.getElementById("username-input").value.trim() || "Player_" + Math.floor(Math.random()*100);
    role = "guest";
    statusMsg.innerText = "Connecting...";
    
    conn = peer.connect(code);
    conn.on('open', () => {
        conn.send({ type: "join", username: myUsername, id: myId });
        document.getElementById("setup-inputs").style.display = "none";
        document.getElementById("player-list-section").style.display = "block";
    });
    conn.on('data', data => handleNetworkData(data, conn));
    conn.on('close', () => { alert("Host disconnected."); location.reload(); });
});

document.getElementById("btn-set-green").addEventListener("click", () => setLight("GREEN"));
document.getElementById("btn-set-red").addEventListener("click", () => setLight("RED"));

function setLight(state) {
    if (!players[myId] || !players[myId].isGuard) return;
    if (state === currentLight) return;

    let now = Date.now();
    // Enforce 1-second cooldown between light changes
    if (now - lastLightSwitchTime < LIGHT_COOLDOWN_MS) return;

    lastLightSwitchTime = now;
    currentLight = state;

    if (state === "RED") {
        redLightStartTime = now;
    } else {
        // Reset all caught flags when switching back to Green Light
        Object.values(players).forEach(p => p.caughtDuringRed = false);
    }

    updateLightUI();
    broadcast({ type: "light-change", light: currentLight, redStartTime: redLightStartTime });
}

canvas.addEventListener("mousedown", (e) => {
    if (!gameRunning || !players[myId] || !players[myId].isGuard) return;
    
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    Object.values(players).forEach(p => {
        if (!p.isGuard) {
            let dist = Math.hypot(p.x - clickX, p.y - clickY);
            if (dist < 20) { 
                // Guard can tag any player who moved during this Red Light phase
                if (currentLight === "RED" && p.caughtDuringRed) {
                    // Send caught player back to the start line
                    p.x = 50;
                    p.caughtDuringRed = false;
                    broadcast({ type: "player-reset", id: p.id, x: 50 });
                }
            }
        }
    });
});

btnStart.addEventListener("click", () => {
    if (role === "host") startNewRound();
});

function startNewRound() {
    let pKeys = Object.keys(players);
    // Pick a random Guard for every match
    let randomGuardId = pKeys[Math.floor(Math.random() * pKeys.length)];

    let sneakers = [];
    pKeys.forEach(k => {
        players[k].isGuard = (k === randomGuardId);
        players[k].score = 0;
        players[k].moving = false;
        players[k].caughtDuringRed = false;
        if (!players[k].isGuard) sneakers.push(players[k]);
    });

    // Guard Position
    players[randomGuardId].x = 740;
    players[randomGuardId].y = 250;

    // Sneakers Position
    sneakers.forEach((p, idx) => {
        p.x = 50;
        p.y = 80 + idx * (340 / Math.max(1, sneakers.length - 1));
    });

    currentLight = "GREEN";
    lastLightSwitchTime = 0;
    broadcast({ type: "start", players });
    beginMatch();
}

function returnToLobby() {
    gameRunning = false;
    gameOverOverlay.style.display = "none";
    gameContainer.style.display = "none";
    lobby.style.display = "block";
    updateLobbyUI();
}

function handleNetworkData(data, c) {
    if (role === "host") {
        if (data.type === "join") {
            players[data.id] = { id: data.id, name: data.username, x: 50, y: 100, isGuard: false, score: 0, moving: false, caughtDuringRed: false, peerId: c.peer };
            broadcast({ type: "sync", players });
            updateLobbyUI();
        }
        if (data.type === "input") {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
                players[data.id].moving = data.moving;
            }
        }
        if (data.type === "request-lobby") {
            returnToLobby();
            broadcast({ type: "return-to-lobby" });
        }
    } else {
        if (data.type === "sync") { players = data.players; updateLobbyUI(); }
        if (data.type === "start") { players = data.players; beginMatch(); }
        if (data.type === "return-to-lobby") { returnToLobby(); }
        if (data.type === "light-change") {
            currentLight = data.light;
            redLightStartTime = data.redStartTime;
            if (currentLight === "GREEN") {
                Object.values(players).forEach(p => p.caughtDuringRed = false);
            }
            updateLightUI();
        }
        if (data.type === "state-update") {
            Object.keys(data.players).forEach(k => {
                if (k !== myId) {
                    players[k].x = data.players[k].x;
                    players[k].y = data.players[k].y;
                    players[k].moving = data.players[k].moving;
                }
                players[k].score = data.players[k].score;
                players[k].caughtDuringRed = data.players[k].caughtDuringRed;
            });
        }
        if (data.type === "player-reset") {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].caughtDuringRed = false;
            }
        }
        if (data.type === "end") { triggerEndGame(data.winnerName); }
    }
}

function broadcast(msg) { connections.forEach(c => c.send(msg)); }

function updateLobbyUI() {
    let count = Object.keys(players).length;
    document.getElementById("count").innerText = count;
    playerListDiv.innerHTML = Object.keys(players).map(k => `<div>• ${players[k].name} ${k === myId ? '<span style="color:#888;">(You)</span>' : ''}</div>`).join('');
    if (role === "host") btnStart.disabled = (count < 2);
}

function updateLightUI() {
    if (currentLight === "GREEN") {
        lightIndicator.innerText = "GREEN LIGHT";
        lightIndicator.className = "light-green";
    } else {
        lightIndicator.innerText = "RED LIGHT";
        lightIndicator.className = "light-red";
    }
}

function beginMatch() {
    lobby.style.display = "none";
    gameOverOverlay.style.display = "none";
    gameContainer.style.display = "block";
    gameRunning = true;
    
    let isMeGuard = players[myId] && players[myId].isGuard;
    if (isMeGuard) {
        guardControls.style.display = "block";
        roleDisplay.innerText = "ROLE: GUARD (Tag players who moved on Red)";
    } else {
        guardControls.style.display = "none";
        roleDisplay.innerText = "ROLE: SNEAKER (Cross line to score!)";
    }

    updateLightUI();

    if (!window.listenersSetup) {
        window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
        window.listenersSetup = true;
    }
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (!gameRunning) return;
    
    processMovement();
    
    if (role === "host") {
        processRules();
        broadcast({ type: "state-update", players });
    } else {
        if (players[myId]) {
            conn.send({ 
                type: "input", 
                id: myId, 
                x: players[myId].x, 
                y: players[myId].y, 
                moving: players[myId].moving 
            });
        }
    }

    renderGraphics();
    requestAnimationFrame(gameLoop);
}

function processMovement() {
    let me = players[myId];
    if (!me || me.isGuard) return;

    let speed = 2.2;
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy = -1;
    if (keys['s'] || keys['arrowdown']) dy = 1;
    if (keys['a'] || keys['arrowleft']) dx = -1;
    if (keys['d'] || keys['arrowright']) dx = 1;

    me.moving = (dx !== 0 || dy !== 0);

    // Track Red-Light Violations
    if (currentLight === "RED") {
        let timeSinceRed = Date.now() - redLightStartTime;
        if (timeSinceRed > GRACE_PERIOD_MS && me.moving) {
            me.caughtDuringRed = true; // Permanently flagged for this Red Light duration
        }
    }

    if (me.moving) {
        let len = Math.hypot(dx, dy);
        me.x += (dx / len) * speed;
        me.y += (dy / len) * speed;
        me.x = Math.max(20, Math.min(canvas.width - 20, me.x));
        me.y = Math.max(20, Math.min(canvas.height - 20, me.y));
    }
}

function processRules() {
    // Check line crossing (First player to 3 points wins match)
    Object.values(players).forEach(p => {
        if (!p.isGuard && p.x >= 700) {
            p.score = (p.score || 0) + 1;
            p.x = 50; // Reset position to start line
            p.caughtDuringRed = false;

            if (p.score >= 3) {
                broadcast({ type: "end", winnerName: p.name });
                triggerEndGame(p.name);
            }
        }
    });
}

function triggerEndGame(winnerName) {
    gameRunning = false;
    document.getElementById("win-title").innerText = `${winnerName} WINS!`;
    
    let btnBox = gameOverOverlay.querySelector("div");
    btnBox.innerHTML = `
        <button class="btn" id="btn-return-lobby" style="background-color:#38b000; color:#fff;">Return to Lobby</button>
        <button class="btn" onclick="location.reload()" style="background-color:#ef4444; color:#fff;">Leave</button>
    `;
    
    document.getElementById("btn-return-lobby").addEventListener("click", () => {
        if (role === "host") {
            returnToLobby();
            broadcast({ type: "return-to-lobby" });
        } else {
            conn.send({ type: "request-lobby" });
        }
    });

    gameOverOverlay.style.display = "flex";
}

function renderGraphics() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Finish Line
    ctx.strokeStyle = "#ff0055";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(700, 0);
    ctx.lineTo(700, canvas.height);
    ctx.stroke();

    Object.values(players).forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);

        if (p.isGuard) {
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = p.caughtDuringRed ? "#ff9900" : "#00f0ff";
            ctx.shadowBlur = p.moving ? 10 : 0;
            ctx.shadowColor = p.caughtDuringRed ? "#ff9900" : "#00f0ff";
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();

        // Name tag & Score
        ctx.fillStyle = "#ffffff";
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        let text = p.isGuard ? `${p.name} [GUARD]` : `${p.name} (${p.score || 0} pts)`;
        ctx.fillText(text, p.x, p.y - 22);
    });
}
    </script>
</body>
</html>

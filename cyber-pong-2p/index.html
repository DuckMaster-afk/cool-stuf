<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Pong 2P</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #040406;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .top-bar {
            width: 700px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-btn {
            color: #9d4edd;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #9d4edd;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.2);
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background-color: #9d4edd;
            color: #040406;
            box-shadow: 0 0 15px #9d4edd;
        }
        .score-board {
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: bold;
        }
        #p1-score { color: #00adb5; }
        #p2-score { color: #ff2e93; }
        canvas {
            background-color: #09090e;
            border: 1px solid #1a1a26;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-height: 65vh;
            max-width: 100%;
            width: auto;
        }
        .controls-guide {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            display: flex;
            gap: 40px;
        }
        .p1-keys { color: #00adb5; }
        .p2-keys { color: #ff2e93; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <div class="score-board">
            <span id="p1-score">0</span> — <span id="p2-score">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="700" height="450"></canvas>

    <div class="controls-guide">
        <div class="p1-keys"><b>Player 1 (Left):</b> W / S keys</div>
        <div>Press <b>SPACEBAR</b> to serve / restart</div>
        <div class="p2-keys"><b>Player 2 (Right):</b> UP / DOWN arrows</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const p1ScoreEl = document.getElementById("p1-score");
        const p2ScoreEl = document.getElementById("p2-score");

        let p1Score = 0;
        let p2Score = 0;
        let gameRunning = false;
        let gameOver = false;
        let winnerText = "";

        const paddleWidth = 10;
        const paddleHeight = 80;
        
        let p1 = { x: 20, y: canvas.height/2 - paddleHeight/2 };
        let p2 = { x: canvas.width - 20 - paddleWidth, y: canvas.height/2 - paddleHeight/2 };

        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 7,
            vx: 4,
            vy: 2,
            speed: 5.5
        };

        let keys = {};
        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            // Prevent browser sorting scrolling issues
            if(["space", " ", "arrowup", "arrowdown"].includes(e.key)) e.preventDefault();
            
            if((e.key === " " || e.key === "Spacebar")) {
                if (gameOver) resetMatch();
                else if (!gameRunning) gameRunning = true;
            }
        });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

        function resetBall(servingToP1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5.5;
            
            let angle = (Math.random() * 40 - 20) * Math.PI / 180; 
            ball.vx = (servingToP1 ? -1 : 1) * ball.speed * Math.cos(angle);
            ball.vy = ball.speed * Math.sin(angle);
            
            gameRunning = false;
        }

        function update() {
            ctx.fillStyle = "#09090e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Divider Line
            ctx.strokeStyle = "rgba(40, 40, 60, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            if (gameRunning && !gameOver) {
                // 1. Player 1 Movement (W / S)
                if (keys['w']) p1.y -= 5.5;
                if (keys['s']) p1.y += 5.5;
                if (p1.y < 10) p1.y = 10;
                if (p1.y > canvas.height - paddleHeight - 10) p1.y = canvas.height - paddleHeight - 10;

                // 2. Player 2 Movement (UP / DOWN Arrows)
                if (keys['arrowup']) p2.y -= 5.5;
                if (keys['arrowdown']) p2.y += 5.5;
                if (p2.y < 10) p2.y = 10;
                if (p2.y > canvas.height - paddleHeight - 10) p2.y = canvas.height - paddleHeight - 10;

                // 3. Ball Physics Loop
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Ceiling/Floor Bounce
                if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                    ball.vy = -ball.vy;
                }

                // Dynamic Paddle Reflections Check
                let targetPaddle = (ball.vx < 0) ? p1 : p2;
                if (ball.x + ball.radius > targetPaddle.x && ball.x - ball.radius < targetPaddle.x + paddleWidth) {
                    if (ball.y > targetPaddle.y && ball.y < targetPaddle.y + paddleHeight) {
                        let relativeIntersectY = (targetPaddle.y + (paddleHeight / 2)) - ball.y;
                        let normalizedIntersectY = (relativeIntersectY / (paddleHeight / 2));
                        let bounceAngle = normalizedIntersectY * (45 * Math.PI / 180);

                        ball.speed = Math.min(ball.speed + 0.5, 13);
                        
                        let direction = (ball.vx < 0) ? 1 : -1;
                        ball.vx = direction * ball.speed * Math.cos(bounceAngle);
                        ball.vy = ball.speed * -Math.sin(bounceAngle);
                    }
                }

                // Check Scores
                if (ball.x < 0) {
                    p2Score++;
                    p2ScoreEl.innerText = p2Score;
                    checkMatchState();
                    resetBall(true);
                } else if (ball.x > canvas.width) {
                    p1Score++;
                    p1ScoreEl.innerText = p1Score;
                    checkMatchState();
                    resetBall(false);
                }
            }

            // Render Paddle Profiles
            ctx.fillStyle = "#00adb5";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00adb5";
            ctx.fillRect(p1.x, p1.y, paddleWidth, paddleHeight);

            ctx.fillStyle = "#ff2e93";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff2e93";
            ctx.fillRect(p2.x, p2.y, paddleWidth, paddleHeight);

            if (!gameOver) {
                ctx.fillStyle = "#fff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#fff";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Overlays Control System
            if (!gameRunning || gameOver) {
                ctx.fillStyle = "rgba(4, 4, 6, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";

                if (gameOver) {
                    ctx.fillStyle = (winnerText === "PLAYER 1 WINS") ? "#00adb5" : "#ff2e93";
                    ctx.font = "bold 32px sans-serif";
                    ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 10);
                    ctx.font = "14px sans-serif";
                    ctx.fillStyle = "#8888aa";
                    ctx.fillText("PRESS SPACEBAR FOR REMATCH", canvas.width / 2, canvas.height / 2 + 35);
                } else {
                    ctx.fillStyle = "#8888aa";
                    ctx.font = "bold 16px sans-serif";
                    ctx.fillText("PRESS SPACEBAR TO SERVE", canvas.width / 2, canvas.height / 2);
                }
            }

            requestAnimationFrame(update);
        }

        function checkMatchState() {
            if (p1Score >= 7) {
                gameOver = true;
                winnerText = "PLAYER 1 WINS";
            } else if (p2Score >= 7) {
                gameOver = true;
                winnerText = "PLAYER 2 WINS";
            }
        }

        function resetMatch() {
            p1Score = 0;
            p2Score = 0;
            p1ScoreEl.innerText = "0";
            p2ScoreEl.innerText = "0";
            gameOver = false;
            winnerText = "";
            resetBall(Math.random() > 0.5);
        }

        update();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tanks Online</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #040406;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        #lobby {
            background-color: #09090e;
            border: 1px solid #1a1a26;
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        h2 { color: #9d4edd; margin-bottom: 20px; }
        .btn {
            background-color: #9d4edd;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 0;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn:hover { background-color: #b066ff; box-shadow: 0 0 15px #9d4edd; }
        .back-btn {
            display: inline-block;
            color: #9d4edd;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #9d4edd;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.2);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #9d4edd;
            color: #040406;
            box-shadow: 0 0 15px #9d4edd;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #2d2d44;
            background-color: #161626;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        #status-msg { color: #8888aa; font-size: 0.9rem; margin-top: 15px; }
        #game-container { display: none; position: relative; text-align: center; }
        canvas {
            background-color: #09090e;
            border: 1px solid #1a1a26;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        .controls-guide {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }
        /* Game Over Overlay Style UI */
        #game-over-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(4, 4, 6, 0.9);
            border-radius: 12px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #win-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #rematch-status {
            color: #8888aa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .action-btns {
            display: flex;
            gap: 15px;
            width: 320px;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <h2>⚔️ Neon Tanks Online</h2>
        <button class="btn" id="btn-create">Create a Room</button>
        <div style="margin: 15px 0; color: #555;">— OR —</div>
        <input type="text" id="room-code-input" placeholder="Enter Room Code">
        <button class="btn" id="btn-join" style="background-color: #00adb5;">Join Room</button>
        <div id="status-msg">Connecting to matchmaking system...</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="480"></canvas>
        
        <div id="game-over-overlay">
            <div id="win-title">MATCH OVER</div>
            <div id="rematch-status">Waiting for players...</div>
            <div class="action-btns">
                <button class="btn" id="btn-restart" style="background-color: #38b000;">Restart</button>
                <button class="btn" id="btn-leave" style="background-color: #ef4444;">Leave Room</button>
            </div>
        </div>

        <div class="controls-guide">
            Use <b>WASD</b> or <b>ARROW KEYS</b> to Move | Press <b>SPACEBAR</b> to Fire
        </div>
    </div>

    <script>
        const lobby = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const gameOverOverlay = document.getElementById("game-over-overlay");
        const winTitle = document.getElementById("win-title");
        const rematchStatus = document.getElementById("rematch-status");
        const statusMsg = document.getElementById("status-msg");
        const codeInput = document.getElementById("room-code-input");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let peer;
        let conn;
        let isHost = false;
        let role = ""; // "host" or "guest"
        let gameRunning = false;
        let matchEnded = false;

        // Rematch Sync States
        let myReadyState = false;
        let enemyReadyState = false;

        // Entities
        let myTank = { x: 0, y: 0, angle: 0, color: "", radius: 14 };
        let enemyTank = { x: 0, y: 0, angle: 0, color: "", radius: 14 };
        let bullets = [];
        let particles = [];
        let keys = {};

        function makeCode() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        peer = new Peer(makeCode());

        peer.on('open', (id) => {
            statusMsg.innerText = "Ready to create or join a room.";
        });

        document.getElementById("btn-create").addEventListener("click", () => {
            isHost = true;
            role = "host";
            statusMsg.innerHTML = `Room Created! Send this code to a friend:<br><b style="font-size: 1.5rem; color: #9d4edd; letter-spacing: 2px;">${peer.id}</b><br><br>Waiting for opponent...`;
            
            peer.on('connection', (connection) => {
                conn = connection;
                setupNetworkCallbacks();
            });
        });

        document.getElementById("btn-join").addEventListener("click", () => {
            const targetCode = codeInput.value.trim().toUpperCase();
            if (!targetCode) return alert("Please enter a room code first.");
            
            isHost = false;
            role = "guest";
            statusMsg.innerText = "Connecting to room...";
            
            conn = peer.connect(targetCode);
            setupNetworkCallbacks();
        });

        // Rematch Engine Trigger Handlers
        document.getElementById("btn-restart").addEventListener("click", () => {
            myReadyState = true;
            document.getElementById("btn-restart").disabled = true;
            document.getElementById("btn-restart").style.opacity = "0.5";
            
            conn.send({ type: "rematch-request", ready: true });
            checkRematchStatus();
        });

        document.getElementById("btn-leave").addEventListener("click", () => {
            if(conn) conn.close();
            location.reload();
        });

        function setupNetworkCallbacks() {
            conn.on('open', () => {
                lobby.style.display = "none";
                gameContainer.style.display = "block";
                startGame();
            });

            conn.on('data', (data) => {
                if (data.type === "update") {
                    enemyTank.x = data.x;
                    enemyTank.y = data.y;
                    enemyTank.angle = data.angle;
                }
                if (data.type === "fire") {
                    bullets.push(data.bullet);
                }
                if (data.type === "destroyed") {
                    triggerGameOver(data.winner === role);
                }
                if (data.type === "rematch-request") {
                    enemyReadyState = data.ready;
                    checkRematchStatus();
                }
            });

            conn.on('close', () => {
                alert("Opponent left the room.");
                location.reload();
            });
        }

        function startGame() {
            // Reset state machine parameters
            matchEnded = false;
            myReadyState = false;
            enemyReadyState = false;
            bullets = [];
            particles = [];
            
            // Re-enable UI components
            document.getElementById("btn-restart").disabled = false;
            document.getElementById("btn-restart").style.opacity = "1";
            gameOverOverlay.style.display = "none";

            if (role === "host") {
                myTank = { x: 60, y: canvas.height / 2, angle: 0, speed: 2.2, turnSpeed: 0.05, radius: 14, color: "#00adb5" };
                enemyTank = { x: canvas.width - 60, y: canvas.height / 2, angle: Math.PI, color: "#ff2e93", radius: 14 };
            } else {
                myTank = { x: canvas.width - 60, y: canvas.height / 2, angle: Math.PI, speed: 2.2, turnSpeed: 0.05, radius: 14, color: "#ff2e93" };
                enemyTank = { x: 60, y: canvas.height / 2, angle: 0, color: "#00adb5", radius: 14 };
            }
            
            if(!gameRunning) {
                gameRunning = true;
                window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
                window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
                update();
            } else {
                gameRunning = true;
            }
        }

        function triggerGameOver(isWinner) {
            matchEnded = true;
            gameRunning = false;
            
            winTitle.innerText = isWinner ? "VICTORY" : "DEFEATED";
            winTitle.style.color = isWinner ? "#00adb5" : "#ff2e93";
            rematchStatus.innerText = "Waiting for players...";
            gameOverOverlay.style.display = "flex";
        }

        function checkRematchStatus() {
            if (myReadyState && enemyReadyState) {
                startGame();
            } else if (myReadyState) {
                rematchStatus.innerText = "Waiting for your opponent to click restart...";
            } else if (enemyReadyState) {
                rematchStatus.innerText = "Opponent is ready! Click restart to fight.";
            }
        }

        let lastShot = 0;
        function update() {
            if (matchEnded) return;

            ctx.fillStyle = "#09090e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                // --- MOVEMENTS ---
                if (keys['w'] || keys['arrowup']) {
                    myTank.x += Math.cos(myTank.angle) * myTank.speed;
                    myTank.y += Math.sin(myTank.angle) * myTank.speed;
                }
                if (keys['s'] || keys['arrowdown']) {
                    myTank.x -= Math.cos(myTank.angle) * myTank.speed;
                    myTank.y -= Math.sin(myTank.angle) * myTank.speed;
                }
                if (keys['a'] || keys['arrowleft']) myTank.angle -= myTank.turnSpeed;
                if (keys['d'] || keys['arrowright']) myTank.angle += myTank.turnSpeed;

                if (myTank.x < myTank.radius) myTank.x = myTank.radius;
                if (myTank.x > canvas.width - myTank.radius) myTank.x = canvas.width - myTank.radius;
                if (myTank.y < myTank.radius) myTank.y = myTank.radius;
                if (myTank.y > canvas.height - myTank.radius) myTank.y = canvas.height - myTank.radius;

                // --- WEAPONS SHOTS ---
                if (keys[' '] && Date.now() - lastShot > 600) {
                    lastShot = Date.now();
                    let b = {
                        x: myTank.x + Math.cos(myTank.angle) * 18,
                        y: myTank.y + Math.sin(myTank.angle) * 18,
                        vx: Math.cos(myTank.angle) * 5,
                        vy: Math.sin(myTank.angle) * 5,
                        radius: 3,
                        color: myTank.color,
                        bounces: 0
                    };
                    bullets.push(b);
                    conn.send({ type: "fire", bullet: b });
                }

                conn.send({ type: "update", x: myTank.x, y: myTank.y, angle: myTank.angle });

                // --- TRAJECTORY PHYSICS ENGINE ---
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) { b.vx = -b.vx; b.bounces++; }
                    if (b.y - b.radius < 0 || b.y + b.radius > canvas.height) { b.vy = -b.vy; b.bounces++; }

                    if (b.bounces > 2) {
                        bullets.splice(i, 1);
                        continue;
                    }

                    // Self-Hit computation
                    if (Math.hypot(b.x - myTank.x, b.y - myTank.y) < myTank.radius) {
                        conn.send({ type: "destroyed", winner: role === "host" ? "guest" : "host" });
                        triggerGameOver(false);
                        return;
                    }
                }
            }

            // --- CANVAS RENDERS DRAW ---
            [myTank, enemyTank].forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.strokeStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(-12, -10, 24, 20);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.stroke();
                ctx.restore();
            });

            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            requestAnimationFrame(update);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vector Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050508; /* Ultra deep space black */
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .top-bar {
            width: 600px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-btn {
            color: #00adb5;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #00adb5;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.2);
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background-color: #00adb5;
            color: #050508;
            box-shadow: 0 0 15px #00adb5;
        }
        .score-board {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #888;
        }
        .score-board span {
            color: #fff;
            font-weight: bold;
        }
        canvas {
            background-color: #09090e;
            border: 1px solid #1f1f2e;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-height: 65vh;
            max-width: 100%;
            width: auto;
            cursor: crosshair;
        }
        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #555566;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <div class="score-board">SCORE: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas" width="700" height="450"></canvas>

    <div class="controls">
        Use <b>W, A, S, D</b> to drift/fly. Aim with <b>MOUSE</b>. <b>LEFT CLICK</b> to fire weapon.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0;
        let gameRunning = true;

        // Mouse Coordinates
        let mouse = { x: canvas.width/2, y: canvas.height/2 };
        
        // Ship Setup (Physics Driven)
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            radius: 12,
            angle: 0,
            speed: 0.15,
            friction: 0.98
        };

        // Arrays for tracking game objects
        let bullets = [];
        let enemies = [];
        let particles = [];
        let keys = {};

        // Listeners
        window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
        
        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            // Accurately map mouse space relative to dynamically sized canvas
            mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener("mousedown", () => {
            if (!gameRunning) {
                resetGame();
                return;
            }
            // Fire bullet along pointing vector angle
            bullets.push({
                x: player.x + Math.cos(player.angle) * player.radius,
                y: player.y + Math.sin(player.angle) * player.radius,
                vx: Math.cos(player.angle) * 7,
                vy: Math.sin(player.angle) * 7,
                radius: 3
            });
        });

        // Advanced burst particle engine
        function spawnExplosion(x, y, color) {
            for(let i=0; i<12; i++) {
                let pAngle = Math.random() * Math.PI * 2;
                let pSpeed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(pAngle) * pSpeed,
                    vy: Math.sin(pAngle) * pSpeed,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    color: color
                });
            }
        }

        function spawnEnemy() {
            if(!gameRunning) return;
            let edge = Math.floor(Math.random() * 4);
            let ex, ey;
            
            if(edge === 0) { ex = Math.random() * canvas.width; ey = -20; }
            else if(edge === 1) { ex = canvas.width + 20; ey = Math.random() * canvas.height; }
            else if(edge === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 20; }
            else { ex = -20; ey = Math.random() * canvas.height; }

            enemies.push({ x: ex, y: ey, radius: 14, speed: Math.random() * 1 + 0.8 });
        }
        setInterval(spawnEnemy, 1200);

        function update() {
            ctx.fillStyle = "rgba(9, 9, 14, 0.3)"; // Creates a modern vector-glowing motion blur effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                // 1. Math Ship Orientation
                player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

                // 2. Physics Movement Handling
                if (keys['w'] || keys['arrowup']) player.vy -= player.speed;
                if (keys['s'] || keys['arrowdown']) player.vy += player.speed;
                if (keys['a'] || keys['arrowleft']) player.vx -= player.speed;
                if (keys['d'] || keys['arrowright']) player.vx += player.speed;

                player.vx *= player.friction;
                player.vy *= player.friction;
                player.x += player.vx;
                player.y += player.vy;

                // Canvas screen boundaries
                if (player.x < player.radius) player.x = player.radius;
                if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
                if (player.y < player.radius) player.y = player.radius;
                if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

                // 3. Draw Neon Vector Ship
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#00adb5";
                ctx.strokeStyle = "#00adb5";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-10, 10);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();

                // 4. Update and Render Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "#fff";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#fff";
                    ctx.fill();

                    // Cleanup out of bounds
                    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }

                // 5. Update and Render Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    let eAngle = Math.atan2(player.y - e.y, player.x - e.x);
                    e.x += Math.cos(eAngle) * e.speed;
                    e.y += Math.sin(eAngle) * e.speed;

                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = "#ff2e93"; // Hot neon pink targets
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff2e93";
                    ctx.stroke();

                    // Check ship crash condition
                    let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                    if (distToPlayer < player.radius + e.radius) {
                        spawnExplosion(player.x, player.y, "#00adb5");
                        gameRunning = false;
                    }

                    // Check bullet hit condition
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        let distToBullet = Math.hypot(b.x - e.x, b.y - e.y);
                        if (distToBullet < b.radius + e.radius) {
                            spawnExplosion(e.x, e.y, "#ff2e93");
                            enemies.splice(i, 1);
                            bullets.splice(j, 1);
                            score += 25;
                            scoreElement.innerText = score;
                            break;
                        }
                    }
                }

                // 6. Update and Decay Explosion Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = p.color;
                        ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.shadowBlur = 0; // Global reset
            } else {
                // Game Over Menu Screen Configuration
                ctx.fillStyle = "rgba(5, 5, 8, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = "#ff2e93";
                ctx.font = "bold 28px sans-serif";
                ctx.fillText("SYSTEM CRASHED", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "14px sans-serif";
                ctx.fillStyle = "#8888aa";
                ctx.fillText("CLICK ANYWHERE ON CANVAS TO REBOOT", canvas.width / 2, canvas.height / 2 + 30);
            }

            requestAnimationFrame(update);
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.vx = 0;
            player.vy = 0;
            bullets = [];
            enemies = [];
            particles = [];
            gameRunning = true;
        }

        update();
    </script>
</body>
</html>

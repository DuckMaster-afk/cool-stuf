<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena Drop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #040406;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .top-bar {
            width: 600px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-btn {
            color: #00adb5;
            text-decoration: none;
            font-weight: 500;
            border: 1px solid #00adb5;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.2);
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background-color: #00adb5;
            color: #040406;
            box-shadow: 0 0 15px #00adb5;
        }
        .score-board {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #888;
        }
        .score-board span {
            color: #fff;
            font-weight: bold;
        }
        canvas {
            background-color: #09090e;
            border: 1px solid #1a1a26;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-height: 65vh;
            max-width: 100%;
            width: auto;
        }
        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #555566;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <div class="score-board">SURVIVORS: <span id="survivors-count">4</span>/4</div>
    </div>

    <canvas id="gameCanvas" width="550" height="550"></canvas>

    <div class="controls">
        Use <b>A / D</b> or <b>LEFT / RIGHT ARROWS</b> to steer your vehicle.<br>
        Tiles disappear and replenish! Outlast the 3 AI bots. Press <b>SPACEBAR</b> to restart.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const survivorsElement = document.getElementById("survivors-count");

        let gameRunning = true;
        let gameOver = false;
        let winStatus = "";

        // Arena configuration
        const arenaCenterX = canvas.width / 2;
        const arenaCenterY = canvas.height / 2;
        const arenaRadius = 240;
        const tileSize = 24;

        let tiles = [];
        let players = [];

        // Generate tiles in a circle pattern layout
        function initArena() {
            tiles = [];
            for (let x = arenaCenterX - arenaRadius; x <= arenaCenterX + arenaRadius; x += tileSize) {
                for (let y = arenaCenterY - arenaRadius; y <= arenaCenterY + arenaRadius; y += tileSize) {
                    let dx = x - arenaCenterX;
                    let dy = y - arenaCenterY;
                    if (Math.hypot(dx, dy) < arenaRadius) {
                        tiles.push({
                            x: x,
                            y: y,
                            state: "safe", // safe -> warning -> dead
                            timer: 0,
                            replenishTimer: 0
                        });
                    }
                }
            }
        }

        function initPlayers() {
            players = [
                // Human Player (Cyan)
                { id: "Player", x: arenaCenterX, y: arenaCenterY + 100, angle: -Math.PI/2, speed: 2.2, turnSpeed: 0.06, color: "#00adb5", alive: true, isAI: false, currentDrift: 0 },
                // AI Competitors (Pink, Orange, Purple)
                { id: "Bot Alpha", x: arenaCenterX - 100, y: arenaCenterY, angle: 0, speed: 2.0, turnSpeed: 0.05, color: "#ff2e93", alive: true, isAI: true, currentDrift: 0 },
                { id: "Bot Beta", x: arenaCenterX + 100, y: arenaCenterY, angle: Math.PI, speed: 2.0, turnSpeed: 0.05, color: "#ff8a00", alive: true, isAI: true, currentDrift: 0 },
                { id: "Bot Gamma", x: arenaCenterX, y: arenaCenterY - 100, angle: Math.PI/2, speed: 2.0, turnSpeed: 0.05, color: "#9d4edd", alive: true, isAI: true, currentDrift: 0 }
            ];
        }

        let keys = {};
        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if(["space", " ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key)) e.preventDefault();
            if((e.key === " " || e.key === "spacebar") && gameOver) resetGame();
        });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Out-of-Bounds Void background circle
            ctx.fillStyle = "#050508";
            ctx.beginPath();
            ctx.arc(arenaCenterX, arenaCenterY, arenaRadius + 10, 0, Math.PI * 2);
            ctx.fill();

            // 1. Process Tile Transitions & Regrowth Systems
            let now = Date.now();
            tiles.forEach(t => {
                if (t.state === "warning" && now - t.timer > 500) {
                    t.state = "dead";
                    t.replenishTimer = now; // Mark time of destruction
                }
                // Replenish tiles after exactly 4.5 seconds
                if (t.state === "dead" && now - t.replenishTimer > 4500) {
                    t.state = "safe";
                }

                // Render Tile
                if (t.state !== "dead") {
                    ctx.fillStyle = t.state === "warning" ? "#ef4444" : "#161626";
                    ctx.strokeStyle = t.state === "warning" ? "#ff4a4a" : "#2d2d44";
                    ctx.lineWidth = 1;
                    ctx.fillRect(t.x + 1, t.y + 1, tileSize - 2, tileSize - 2);
                    ctx.strokeRect(t.x + 1, t.y + 1, tileSize - 2, tileSize - 2);
                }
            });

            if (!gameOver) {
                // 2. Drive & Track All Active Competitors
                players.forEach(p => {
                    if (!p.alive) return;

                    let aiSteering = 0;

                    if (!p.isAI) {
                        // Human Steering controls
                        if (keys['a'] || keys['arrowleft']) {
                            p.angle -= p.turnSpeed;
                            aiSteering = -0.35; // Slide tail-out left
                        }
                        if (keys['d'] || keys['arrowright']) {
                            p.angle += p.turnSpeed;
                            aiSteering = 0.35; // Slide tail-out right
                        }
                        // Smoothly interpolate the chassis slide angle
                        p.currentDrift += (aiSteering - p.currentDrift) * 0.1;
                    } else {
                        // AI Logic: Smarter 3-Point Raycast to actively avoid edges and dead tiles
                        let lookAheadDist = 45; // Look further ahead to react earlier
                        let anglesToCheck = [0, -0.4, 0.4]; // Center, Left, Right raycasts
                        let weights = [0, 0, 0]; // Danger scores for each direction

                        for (let idx = 0; idx < anglesToCheck.length; idx++) {
                            let checkAngle = p.angle + anglesToCheck[idx];
                            let checkX = p.x + Math.cos(checkAngle) * lookAheadDist;
                            let checkY = p.y + Math.sin(checkAngle) * lookAheadDist;

                            let targetTile = tiles.find(t => checkX >= t.x && checkX < t.x + tileSize && checkY >= t.y && checkY < t.y + tileSize);
                            let distFromCenter = Math.hypot(checkX - arenaCenterX, checkY - arenaCenterY);

                            // If there's no tile, the tile is dead, or it's approaching the edge, add danger weight
                            if (!targetTile || targetTile.state === "dead") {
                                weights[idx] += 10;
                            } else if (targetTile.state === "warning") {
                                weights[idx] += 5; // Avoid tiles that are about to drop
                            }
                            if (distFromCenter > arenaRadius - 30) {
                                weights[idx] += 15; // Heavy danger weight near the outer rim
                            }
                        }

                        // Decision Making: If Center or sides are dangerous, pick the safer side
                        if (weights[0] > 0 || weights[1] > 0 || weights[2] > 0) {
                            if (weights[1] < weights[2]) {
                                p.angle -= p.turnSpeed * 1.5; // Turn Left
                                aiSteering = -0.3;
                            } else {
                                p.angle += p.turnSpeed * 1.5; // Turn Right
                                aiSteering = 0.3;
                            }
                        } else {
                            // Occasional random wandering if the path ahead is completely safe
                            if (Math.random() * 100 > 98) {
                                let turnDir = (Math.random() - 0.5) * 2;
                                p.angle += p.turnSpeed * turnDir;
                                aiSteering = 0.15 * turnDir;
                            }
                        }
                        p.currentDrift += (aiSteering - p.currentDrift) * 0.1;
                    }

                    // Vector forward calculation translation mapping
                    p.x += Math.cos(p.angle) * p.speed;
                    p.y += Math.sin(p.angle) * p.speed;

                    // Check which tile the car center point sits inside
                    let currentTile = tiles.find(t => p.x >= t.x && p.x < t.x + tileSize && p.y >= t.y && p.y < t.y + tileSize);

                    // Drop down state mechanics engine triggers
                    if (!currentTile || currentTile.state === "dead" || Math.hypot(p.x - arenaCenterX, p.y - arenaCenterY) > arenaRadius) {
                        p.alive = false;
                        checkMatchStatus();
                    } else if (currentTile.state === "safe") {
                        currentTile.state = "warning";
                        currentTile.timer = now;
                    }

                    // Render Active Racer Profiles with Drift Slips
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle + p.currentDrift);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    
                    // Sharp wedge indicator shape
                    ctx.beginPath();
                    ctx.moveTo(10, 0);   // Nose point
                    ctx.lineTo(-8, -6);  // Tail left
                    ctx.lineTo(-4, 0);   // Tail tuck
                    ctx.lineTo(-8, 6);   // Tail right
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                    ctx.shadowBlur = 0;
                });
            } else {
                // Game Over Screen Layout
                ctx.fillStyle = "rgba(4, 4, 6, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = winStatus === "VICTORY" ? "#00adb5" : "#ff2e93";
                ctx.font = "bold 32px sans-serif";
                ctx.fillText(winStatus, canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "14px sans-serif";
                ctx.fillStyle = "#8888aa";
                ctx.fillText("PRESS SPACEBAR TO REBOOT THE MATCH", canvas.width / 2, canvas.height / 2 + 35);
            }

            requestAnimationFrame(update);
        }

        function checkMatchStatus() {
            let aliveCount = players.filter(p => p.alive).length;
            survivorsElement.innerText = aliveCount;

            let playerAlive = players.find(p => p.id === "Player").alive;

            if (!playerAlive) {
                gameOver = true;
                winStatus = "ELIMINATED";
            } else if (aliveCount === 1 && playerAlive) {
                gameOver = true;
                winStatus = "VICTORY";
            }
        }

        function resetGame() {
            gameOver = false;
            winStatus = "";
            initArena();
            initPlayers();
            survivorsElement.innerText = "4";
        }

        initArena();
        initPlayers();
        update();
    </script>
</body>
</html>

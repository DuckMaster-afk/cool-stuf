<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Sling Arena Online</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #040406; color: #fafafa;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; padding: 20px;
        }
        #lobby {
            background-color: #09090e; border: 1px solid #1a1a26; border-radius: 12px;
            padding: 30px; width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        h2 { color: #00f0ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f0ff; }
        .btn {
            background-color: #00f0ff; color: #040406; border: none; padding: 10px 20px;
            font-size: 1rem; border-radius: 20px; cursor: pointer; font-weight: bold;
            margin: 10px 0; width: 100%; transition: all 0.2s ease;
        }
        .btn:hover { background-color: #70f8ff; box-shadow: 0 0 15px #00f0ff; }
        .btn:disabled { background-color: #333; cursor: not-allowed; box-shadow: none; color: #777; }
        .back-btn {
            display: inline-block; color: #00f0ff; text-decoration: none; font-weight: 500;
            border: 1px solid #00f0ff; padding: 6px 14px; border-radius: 20px; margin-bottom: 20px;
        }
        input {
            width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #2d2d44;
            background-color: #161626; color: #fff; text-align: center; font-size: 1rem; margin-bottom: 10px;
        }
        #player-list {
            margin: 15px 0; background: #11111b; border-radius: 8px; padding: 10px;
            text-align: left; font-size: 0.9rem; max-height: 120px; overflow-y: auto;
        }
        #status-msg { color: #8888aa; font-size: 0.9rem; margin-top: 10px; }
        #game-container { display: none; position: relative; text-align: center; }
        canvas { background-color: #0c0c14; border: 1px solid #1a1a26; border-radius: 12px; cursor: crosshair; }
        #ui-bar {
            width: 100%; display: flex; justify-content: space-between;
            margin-bottom: 10px; font-size: 1.1rem; font-weight: bold;
        }
        #game-over-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 6, 0.95); border-radius: 12px;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <h2>💥 Neon Sling Arena</h2>
        
        <div id="setup-inputs">
            <input type="text" id="username-input" placeholder="Enter Username (Optional)">
            <button class="btn" id="btn-create">Create Room (Host)</button>
            <div style="margin: 10px 0; color: #444;">— OR —</div>
            <input type="text" id="room-code-input" placeholder="Enter Room Code">
            <button class="btn" id="btn-join" style="background-color: #ff007f; color: #fff;">Join Room</button>
        </div>
        
        <div id="player-list-section" style="display:none; margin-top:15px;">
            <div style="font-weight:bold; color:#00f0ff;">Players connected (<span id="count">0</span>/8):</div>
            <div id="player-list"></div>
            <button class="btn" id="btn-start" style="background-color:#38b000; color:#fff;" disabled>Start Match (Need 2+ Players)</button>
        </div>
        <div id="status-msg">Initializing network link...</div>
    </div>

    <div id="game-container">
        <div id="ui-bar">
            <div id="lives-display" style="color: #00f0ff;">SHIELDS: 3</div>
            <div id="players-alive-display" style="color: #ff007f;">PLAYERS ALIVE: 0</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="game-over-overlay">
            <h1 id="win-title" style="font-size:3rem; margin-bottom:10px; color:#00f0ff;">WINNER!</h1>
            <div style="display: flex; gap: 15px; width: 320px;">
                <button class="btn" id="btn-rematch" style="background-color:#38b000; color:#fff;">Return to Lobby</button>
                <button class="btn" onclick="location.reload()" style="background-color:#ef4444; color:#fff;">Leave</button>
            </div>
        </div>
    </div>

    <script>
        const colorPalette = ["#00f0ff", "#ff007f", "#39ff14", "#ffe600", "#ff6600", "#b066ff"];
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const lobby = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const playerListDiv = document.getElementById("player-list");
        const statusMsg = document.getElementById("status-msg");
        const btnStart = document.getElementById("btn-start");
        const gameOverOverlay = document.getElementById("game-over-overlay");

        let peer, conn, role = ""; 
        let myId = "";
        let myUsername = "";
        let connections = []; 
        let players = {};     
        let projectiles = [];
        let gameRunning = false;
        let keys = {};
        let mouseX = 0, mouseY = 0;
        let lastShotTime = 0;

        peer = new Peer(Math.random().toString(36).substring(2, 7).toUpperCase());
        peer.on('open', id => { myId = id; statusMsg.innerText = "Network ready."; });

        document.getElementById("btn-create").addEventListener("click", () => {
            if (!myId) return;
            myUsername = document.getElementById("username-input").value.trim() || "Slinger_" + Math.floor(Math.random()*100);
            role = "host";
            document.getElementById("setup-inputs").style.display = "none";
            document.getElementById("player-list-section").style.display = "block";
            btnStart.style.display = "block";
            statusMsg.innerHTML = `Room Code: <b style='color:#00f0ff; font-size:1.3rem;'>${myId}</b>`;
            
            players[myId] = { id: myId, name: myUsername, x: 100, y: 250, angle: 0, lives: 3, color: colorPalette[0] };
            updateLobbyUI();

            peer.on('connection', c => {
                if (Object.keys(players).length >= 8 || gameRunning) { setTimeout(() => c.close(), 500); return; }
                c.on('open', () => {
                    connections.push(c);
                    c.on('data', data => handleNetworkData(data, c));
                    c.send({ type: "sync", players });
                });
                c.on('close', () => {
                    connections = connections.filter(conn => conn !== c);
                    let leftId = Object.keys(players).find(k => players[k].peerId === c.peer);
                    if(leftId) { delete players[leftId]; broadcast({type: "sync", players}); updateLobbyUI(); }
                });
            });
        });

        document.getElementById("btn-join").addEventListener("click", () => {
            let code = document.getElementById("room-code-input").value.trim().toUpperCase();
            if(!code) return alert("Enter room code.");
            myUsername = document.getElementById("username-input").value.trim() || "Slinger_" + Math.floor(Math.random()*100);
            role = "guest";
            statusMsg.innerText = "Connecting...";
            
            conn = peer.connect(code);
            conn.on('open', () => {
                conn.send({ type: "join", username: myUsername, id: myId });
                document.getElementById("setup-inputs").style.display = "none";
                document.getElementById("player-list-section").style.display = "block";
            });
            conn.on('data', data => handleNetworkData(data, conn));
            conn.on('close', () => { alert("Host disconnected."); location.reload(); });
        });

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener("mousedown", () => {
            if (!gameRunning) return;
            let me = players[myId];
            if (!me || me.lives <= 0) return;

            let now = Date.now();
            if (now - lastShotTime > 400) { // 400ms shoot cooldown
                lastShotTime = now;
                let shotData = {
                    x: me.x + Math.cos(me.angle) * 20,
                    y: me.y + Math.sin(me.angle) * 20,
                    vx: Math.cos(me.angle) * 8,
                    vy: Math.sin(me.angle) * 8,
                    ownerId: myId,
                    color: me.color
                };
                
                if (role === "host") {
                    projectiles.push({ ...shotData, id: Math.random() });
                } else {
                    conn.send({ type: "shoot", shot: shotData });
                }
            }
        });

        btnStart.addEventListener("click", () => {
            let keysArray = Object.keys(players);
            keysArray.forEach((k, index) => {
                players[k].lives = 3;
                players[k].color = colorPalette[index % colorPalette.length];
                players[k].x = 150 + (index * 220) % 600;
                players[k].y = 120 + Math.floor(index / 3) * 180;
            });
            projectiles = [];
            broadcast({ type: "start", players });
            beginMatch();
        });

        document.getElementById("btn-rematch").addEventListener("click", () => {
            if (role === "host") {
                returnToLobby();
                broadcast({ type: "return-to-lobby" });
            } else {
                conn.send({ type: "request-lobby" });
            }
        });

        function returnToLobby() {
            gameRunning = false;
            gameOverOverlay.style.display = "none";
            gameContainer.style.display = "none";
            lobby.style.display = "block";
            updateLobbyUI();
        }

        function handleNetworkData(data, c) {
            if (role === "host") {
                if (data.type === "join") {
                    players[data.id] = { id: data.id, name: data.username, x: 0, y: 0, angle: 0, lives: 3, color: colorPalette[Object.keys(players).length % colorPalette.length], peerId: c.peer };
                    broadcast({ type: "sync", players });
                    updateLobbyUI();
                }
                if (data.type === "input") {
                    if(players[data.id] && players[data.id].lives > 0) {
                        players[data.id].x = data.x; players[data.id].y = data.y; players[data.id].angle = data.angle;
                    }
                }
                if (data.type === "shoot") {
                    projectiles.push({ ...data.shot, id: Math.random() });
                }
                if (data.type === "request-lobby") {
                    returnToLobby();
                    broadcast({ type: "return-to-lobby" });
                }
            } else {
                if (data.type === "sync") { players = data.players; updateLobbyUI(); }
                if (data.type === "start") { players = data.players; beginMatch(); }
                if (data.type === "return-to-lobby") { returnToLobby(); }
                if (data.type === "state-update") { 
                    Object.keys(data.players).forEach(k => {
                        if(k !== myId) {
                            players[k].x = data.players[k].x; 
                            players[k].y = data.players[k].y; 
                            players[k].angle = data.players[k].angle; 
                        }
                        players[k].lives = data.players[k].lives;
                    });
                    projectiles = data.projectiles;
                    updateUIBar();
                }
                if (data.type === "end") { triggerEndGame(data.winnerName); }
            }
        }

        function broadcast(msg) { connections.forEach(c => c.send(msg)); }

        function updateLobbyUI() {
            let count = Object.keys(players).length;
            document.getElementById("count").innerText = count;
            playerListDiv.innerHTML = Object.keys(players).map(k => `<div>• ${players[k].name} ${k === myId ? '<span style="color:#888;">(You)</span>' : ''}</div>`).join('');
            if (role === "host") btnStart.disabled = (count < 2);
        }

        function beginMatch() {
            lobby.style.display = "none";
            gameOverOverlay.style.display = "none";
            gameContainer.style.display = "block";
            gameRunning = true;
            
            if(!window.listenersSetup) {
                window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
                window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
                window.listenersSetup = true;
            }
            updateUIBar();
            requestAnimationFrame(gameLoop);
        }

        function updateUIBar() {
            let me = players[myId];
            if(me) document.getElementById("lives-display").innerText = `SHIELDS: ${Math.max(0, me.lives)}`;
            let aliveCount = Object.values(players).filter(p => p.lives > 0).length;
            document.getElementById("players-alive-display").innerText = `PLAYERS ALIVE: ${aliveCount}`;
        }

        function gameLoop() {
            if (!gameRunning) return;
            processMovement();
            
            if (role === "host") {
                processPhysics();
                broadcast({ type: "state-update", players, projectiles });
            } else {
                if (players[myId]) conn.send({ type: "input", id: myId, x: players[myId].x, y: players[myId].y, angle: players[myId].angle });
            }

            renderGraphics();
            requestAnimationFrame(gameLoop);
        }

        function processMovement() {
            let me = players[myId];
            if (!me || me.lives <= 0) return;

            me.angle = Math.atan2(mouseY - me.y, mouseX - me.x);

            let speed = 3.2;
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) dy = -1;
            if (keys['s'] || keys['arrowdown']) dy = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                let len = Math.hypot(dx, dy);
                me.x += (dx / len) * speed;
                me.y += (dy / len) * speed;
                me.x = Math.max(16, Math.min(canvas.width - 16, me.x));
                me.y = Math.max(16, Math.min(canvas.height - 16, me.y));
            }
        }

        function processPhysics() {
            // Move projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx;
                p.y += p.vy;

                // Wall bounces
                if (p.x <= 8 || p.x >= canvas.width - 8) p.vx *= -1;
                if (p.y <= 8 || p.y >= canvas.height - 8) p.vy *= -1;

                // Player collisions
                Object.values(players).forEach(pl => {
                    if (pl.lives > 0 && pl.id !== p.ownerId) {
                        if (Math.hypot(pl.x - p.x, pl.y - p.y) < 20) {
                            pl.lives--;
                            projectiles.splice(i, 1);
                        }
                    }
                });
            }

            // Check Win Condition
            let alivePlayers = Object.values(players).filter(p => p.lives > 0);
            if (alivePlayers.length <= 1 && Object.keys(players).length > 1) {
                let winnerName = alivePlayers.length === 1 ? alivePlayers[0].name : "NOBODY";
                broadcast({ type: "end", winnerName });
                triggerEndGame(winnerName);
            }
        }

        function triggerEndGame(winnerName) {
            gameRunning = false;
            document.getElementById("win-title").innerText = `${winnerName} WINS!`;
            gameOverOverlay.style.display = "flex";
        }

        function renderGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Projectiles
            projectiles.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Render Players
            Object.values(players).forEach(p => {
                if (p.lives <= 0) return;

                ctx.save();
                ctx.translate(p.x, p.y);

                // Body
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                // Aiming Pointer
                ctx.rotate(p.angle);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(10, -3, 10, 6);

                ctx.restore();

                // Name & Shields Text
                ctx.fillStyle = "#ffffff";
                ctx.font = "11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`${p.name} [${p.lives}]`, p.x, p.y - 22);
            });
        }
    </script>
</body>
</html>

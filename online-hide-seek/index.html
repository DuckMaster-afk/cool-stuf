<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hide & Seek Online</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #040406; color: #fafafa;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; padding: 20px;
        }
        #lobby {
            background-color: #09090e; border: 1px solid #1a1a26; border-radius: 12px;
            padding: 30px; width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }
        h2 { color: #9d4edd; margin-bottom: 20px; }
        .btn {
            background-color: #9d4edd; color: #fff; border: none; padding: 10px 20px;
            font-size: 1rem; border-radius: 20px; cursor: pointer; font-weight: bold;
            margin: 10px 0; width: 100%; transition: all 0.2s ease;
        }
        .btn:hover { background-color: #b066ff; box-shadow: 0 0 15px #9d4edd; }
        .btn:disabled { background-color: #333; cursor: not-allowed; box-shadow: none; color: #777; }
        .back-btn {
            display: inline-block; color: #9d4edd; text-decoration: none; font-weight: 500;
            border: 1px solid #9d4edd; padding: 6px 14px; border-radius: 20px; margin-bottom: 20px;
        }
        .back-btn:hover { background-color: #9d4edd; color: #040406; }
        input {
            width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #2d2d44;
            background-color: #161626; color: #fff; text-align: center; font-size: 1rem; margin-bottom: 10px;
        }
        #player-list {
            margin: 15px 0; background: #11111b; border-radius: 8px; padding: 10px;
            text-align: left; font-size: 0.9rem; max-height: 120px; overflow-y: auto;
        }
        #status-msg { color: #8888aa; font-size: 0.9rem; margin-top: 10px; }
        #game-container { display: none; position: relative; text-align: center; }
        canvas { background-color: #0c0c14; border: 1px solid #1a1a26; border-radius: 12px; cursor: crosshair; }
        #ui-bar {
            width: 100%; display: flex; justify-content: space-between;
            margin-bottom: 10px; font-size: 1.2rem; font-weight: bold;
        }
        #game-over-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 6, 0.95); border-radius: 12px;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .action-btns { display: flex; gap: 15px; width: 320px; }
    </style>
</head>
<body>

    <div id="lobby">
        <a href="../index.html" class="back-btn">← Leave Zone</a>
        <h2>👥 Hide & Seek Online</h2>
        
        <div id="setup-inputs">
            <input type="text" id="username-input" placeholder="Enter Username (Optional)">
            <button class="btn" id="btn-create">Create Room (Host)</button>
            <div style="margin: 10px 0; color: #444;">— OR —</div>
            <input type="text" id="room-code-input" placeholder="Enter Room Code">
            <button class="btn" id="btn-join" style="background-color: #00adb5;">Join Room</button>
        </div>
        
        <div id="player-list-section" style="display:none; margin-top:15px;">
            <div style="font-weight:bold; color:#9d4edd;">Players connected (<span id="count">0</span>/8):</div>
            <div id="player-list"></div>
            <button class="btn" id="btn-start" style="background-color:#38b000; display:none;" disabled>Start Match (Need 2+ Players)</button>
        </div>
        <div id="status-msg">Initializing network link...</div>
    </div>

    <div id="game-container">
        <div id="ui-bar">
            <div id="role-display" style="color: #00adb5;">ROLE: WAITING</div>
            <div id="timer-display" style="color: #ff8a00;">TIME: 03:00</div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="game-over-overlay">
            <h1 id="win-title" style="font-size:3rem; margin-bottom:10px;">HIDERS WIN</h1>
            <div id="rematch-status" style="color:#8888aa; margin-bottom:20px;">Waiting for players to request rematch...</div>
            <div class="action-btns">
                <button class="btn" id="btn-rematch-request" style="background-color:#38b000;">Return to Lobby</button>
                <button class="btn" onclick="location.reload()" style="background-color:#ef4444;">Leave Room</button>
            </div>
        </div>
    </div>

    <script>
        const adjectives = ["Neon", "Cyber", "Shadow", "Quantum", "Retro", "Ghost", "Alpha", "Turbo"];
        const nouns = ["Tank", "Racer", "Runner", "Phantom", "Ninja", "Glitch", "Cyborg", "Vortex"];
        
        function getRandomName() {
            return adjectives[Math.floor(Math.random()*adjectives.length)] + nouns[Math.floor(Math.random()*nouns.length)];
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const lobby = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const playerListDiv = document.getElementById("player-list");
        const statusMsg = document.getElementById("status-msg");
        const btnStart = document.getElementById("btn-start");
        const gameOverOverlay = document.getElementById("game-over-overlay");
        const rematchStatusText = document.getElementById("rematch-status");

        let peer, conn, role = ""; 
        let myId = "";
        let myUsername = "";
        let connections = []; 
        let players = {};     
        let gameRunning = false;
        let keys = {};
        let mouseX = 0, mouseY = 0;
        let timeRemaining = 180; 
        let releaseCountdown = 5; 
        let timerInterval;

        const obstacles = [
            { x: 180, y: 100, w: 40, h: 120 },
            { x: 580, y: 100, w: 40, h: 120 },
            { x: 340, y: 220, w: 120, h: 40 },
            { x: 180, y: 300, w: 40, h: 120 },
            { x: 580, y: 300, w: 40, h: 120 },
            { x: 60, y: 220, w: 80, h: 40 },
            { x: 660, y: 220, w: 80, h: 40 }
        ];

        peer = new Peer(Math.random().toString(36).substring(2, 7).toUpperCase());
        peer.on('open', id => { myId = id; statusMsg.innerText = "Matchmaker ready."; });

        document.getElementById("btn-create").addEventListener("click", () => {
            if (!myId) return alert("Still waiting for network initialization.");
            myUsername = document.getElementById("username-input").value.trim() || getRandomName();
            role = "host";
            document.getElementById("setup-inputs").style.display = "none";
            document.getElementById("player-list-section").style.display = "block";
            btnStart.style.display = "block";
            statusMsg.innerHTML = `Room Code: <b style='color:#9d4edd; font-size:1.3rem;'>${myId}</b>`;
            
            players[myId] = { id: myId, name: myUsername, x: 100, y: 250, angle: 0, seeker: false, caught: false, inConeTime: 0, radius: 14 };
            updateLobbyUI();

            peer.on('connection', c => {
                if (Object.keys(players).length >= 8 || gameRunning) { setTimeout(() => c.close(), 500); return; }
                c.on('open', () => {
                    connections.push(c);
                    c.on('data', data => handleNetworkData(data, c));
                    // Send initial structural sync
                    c.send({ type: "sync", players });
                });
                c.on('close', () => {
                    connections = connections.filter(conn => conn !== c);
                    let leftId = Object.keys(players).find(k => players[k].peerId === c.peer);
                    if(leftId) { delete players[leftId]; broadcast({type: "sync", players}); updateLobbyUI(); }
                });
            });
        });

        document.getElementById("btn-join").addEventListener("click", () => {
            let code = document.getElementById("room-code-input").value.trim().toUpperCase();
            if(!code) return alert("Please enter a room code.");
            myUsername = document.getElementById("username-input").value.trim() || getRandomName();
            role = "guest";
            statusMsg.innerText = "Connecting to Host room...";
            
            conn = peer.connect(code);
            conn.on('open', () => {
                conn.send({ type: "join", username: myUsername, id: myId });
                document.getElementById("setup-inputs").style.display = "none";
                document.getElementById("player-list-section").style.display = "block";
                statusMsg.innerText = "Joined room! Awaiting host match start...";
            });
            conn.on('data', data => handleNetworkData(data, conn));
            conn.on('close', () => { alert("Host closed session."); location.reload(); });
        });

        // Track Mouse Coordinates across the Canvas Element
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        btnStart.addEventListener("click", () => {
            let keysArray = Object.keys(players);
            let randomSeeker = keysArray[Math.floor(Math.random() * keysArray.length)];
            
            keysArray.forEach(k => {
                players[k].seeker = (k === randomSeeker);
                players[k].caught = false;
                players[k].inConeTime = 0;
                players[k].radius = 14;
                if (players[k].seeker) {
                    players[k].x = 400; players[k].y = 150; players[k].angle = Math.PI / 2;
                } else {
                    players[k].x = 70 + Math.random() * 180 + (Math.random() > 0.5 ? 450 : 0);
                    players[k].y = 70 + Math.random() * 360;
                    players[k].angle = Math.random() * Math.PI * 2;
                    while(checkObstacleCollision(players[k].x, players[k].y, 14)) {
                        players[k].x = 50 + Math.random() * 700;
                        players[k].y = 50 + Math.random() * 400;
                    }
                }
            });

            broadcast({ type: "start", players });
            beginMatch();
        });

        // Trigger Back to Lobby request sync mechanism
        document.getElementById("btn-rematch-request").addEventListener("click", () => {
            if (role === "host") {
                returnToLobbyMenu();
                broadcast({ type: "return-to-lobby" });
            } else {
                conn.send({ type: "request-lobby-return" });
                document.getElementById("btn-rematch-request").disabled = true;
                rematchStatusText.innerText = "Sent request to host...";
            }
        });

        function returnToLobbyMenu() {
            gameRunning = false;
            clearInterval(timerInterval);
            gameOverOverlay.style.display = "none";
            gameContainer.style.display = "none";
            lobby.style.display = "block";
            document.getElementById("btn-rematch-request").disabled = false;
            rematchStatusText.innerText = "Waiting for players to request rematch...";
            updateLobbyUI();
        }

        function handleNetworkData(data, c) {
            if (role === "host") {
                if (data.type === "join") {
                    players[data.id] = { id: data.id, name: data.username, x: 0, y: 0, angle: 0, seeker: false, caught: false, inConeTime: 0, radius: 14, peerId: c.peer };
                    broadcast({ type: "sync", players });
                    updateLobbyUI();
                }
                if (data.type === "input") {
                    if(players[data.id] && !players[data.id].caught) {
                        players[data.id].x = data.x; players[data.id].y = data.y; players[data.id].angle = data.angle;
                    }
                }
                if (data.type === "request-lobby-return") {
                    returnToLobbyMenu();
                    broadcast({ type: "return-to-lobby" });
                }
            } else {
                if (data.type === "sync") { players = data.players; updateLobbyUI(); }
                if (data.type === "start") { players = data.players; beginMatch(); }
                if (data.type === "return-to-lobby") { returnToLobbyMenu(); }
                if (data.type === "state-update") { 
                    Object.keys(data.players).forEach(k => {
                        if(k !== myId) { players[k].x = data.players[k].x; players[k].y = data.players[k].y; players[k].angle = data.players[k].angle; }
                        players[k].caught = data.players[k].caught;
                        players[k].inConeTime = data.players[k].inConeTime;
                    });
                    timeRemaining = data.timeRemaining;
                    releaseCountdown = data.releaseCountdown;
                    updateUIBar();
                }
                if (data.type === "end") { triggerEndGame(data.winner); }
            }
        }

        function broadcast(msg) { connections.forEach(c => c.send(msg)); }

        function updateLobbyUI() {
            let count = Object.keys(players).length;
            document.getElementById("count").innerText = count;
            playerListDiv.innerHTML = Object.keys(players).map(k => `<div>• ${players[k].name} ${k === myId ? '<span style="color:#888;">(You)</span>' : ''}</div>`).join('');
            if (role === "host") btnStart.disabled = (count < 2);
        }

        function beginMatch() {
            lobby.style.display = "none";
            gameOverOverlay.style.display = "none";
            gameContainer.style.display = "block";
            gameRunning = true;
            releaseCountdown = 5;
            timeRemaining = 180;
            
            // Re-setup movement keyboard event filters
            if(window.listenersSetup === undefined) {
                window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key)) e.preventDefault();});
                window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
                window.listenersSetup = true;
            }
            
            if (role === "host") {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (releaseCountdown > 0) {
                        releaseCountdown--;
                    } else {
                        timeRemaining--;
                        if(timeRemaining <= 0) evaluateWinCondition(true);
                    }
                }, 1000);
            }
            updateUIBar();
            requestAnimationFrame(gameLoop);
        }

        function updateUIBar() {
            let me = players[myId];
            if(!me) return;
            if (releaseCountdown > 0) {
                document.getElementById("timer-display").innerText = `SEEKER RELEASE IN: ${releaseCountdown}s`;
                document.getElementById("timer-display").style.color = "#ff2e93";
            } else {
                let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let secs = (timeRemaining % 60).toString().padStart(2, '0');
                document.getElementById("timer-display").innerText = `TIME: ${mins}:${secs}`;
                document.getElementById("timer-display").style.color = "#ff8a00";
            }
            document.getElementById("role-display").innerText = me.seeker ? "ROLE: SEEKER 🔎" : (me.caught ? "ROLE: CAUGHT 💀" : "ROLE: HIDER 🏃‍♂️");
            document.getElementById("role-display").style.color = me.seeker ? "#ff2e93" : "#00adb5";
        }

        function checkObstacleCollision(x, y, r) {
            for (let obs of obstacles) {
                let closestX = Math.max(obs.x, Math.min(x, obs.x + obs.w));
                let closestY = Math.max(obs.y, Math.min(y, obs.y + obs.h));
                if (Math.hypot(x - closestX, y - closestY) < r) return true;
            }
            return false;
        }

        function isLineOfSightBlocked(x1, y1, x2, y2) {
            for (let obs of obstacles) {
                if (lineIntersectsRect(x1, y1, x2, y2, obs)) return true;
            }
            return false;
        }

        function lineIntersectsRect(x1, y1, x2, y2, rect) {
            let rx1 = rect.x, ry1 = rect.y, rx2 = rect.x + rect.w, ry2 = rect.y + rect.h;
            return lineIntersectsLine(x1,y1,x2,y2, rx1,ry1,rx2,ry1) ||
                   lineIntersectsLine(x1,y1,x2,y2, rx2,ry1,rx2,ry2) ||
                   lineIntersectsLine(x1,y1,x2,y2, rx1,ry2,rx2,ry2) ||
                   lineIntersectsLine(x1,y1,x2,y2, rx1,ry1,rx1,ry2);
        }

        function lineIntersectsLine(x1, y1, x2, y2, x3, y3, x4, y4) {
            let uA = ((x4-x3)*(y1-y3) - (y4-y3)*(x1-x3)) / ((y4-y3)*(x2-x1) - (x4-x3)*(y2-y1));
            let uB = ((x2-x1)*(y1-y3) - (y2-y1)*(x1-x3)) / ((y4-y3)*(x2-x1) - (x4-x3)*(y2-y1));
            return (uA >= 0 && uA <= 1 && uB >= 0 && uB <= 1);
        }

        function gameLoop() {
            if (!gameRunning) return;
            processLocalMovement();
            
            if (role === "host") {
                processRulesEngine();
                broadcast({ type: "state-update", players, timeRemaining, releaseCountdown });
            } else {
                if (players[myId]) conn.send({ type: "input", id: myId, x: players[myId].x, y: players[myId].y, angle: players[myId].angle });
            }

            renderGraphics();
            requestAnimationFrame(gameLoop);
        }

        function processLocalMovement() {
            let me = players[myId];
            if (!me || me.caught) return;

            // MOUSE AIM ENGINE: Angle tracking maps directly to the mouse cursor 
            me.angle = Math.atan2(mouseY - me.y, mouseX - me.x);

            if (me.seeker && releaseCountdown > 0) return; 

            // WASD/Arrow keys handle stage-relative layout traversal
            let speed = me.seeker ? 2.5 : 3.0; 
            let dx = 0, dy = 0;

            if (keys['w'] || keys['arrowup']) dy = -1;
            if (keys['s'] || keys['arrowdown']) dy = 1;
            if (keys['a'] || keys['arrowleft']) dx = -1;
            if (keys['d'] || keys['arrowright']) dx = 1;

            if (dx !== 0 || dy !== 0) {
                // Normalize axis vectors 
                let length = Math.hypot(dx, dy);
                dx /= length; dy /= length;

                let oldX = me.x, oldY = me.y;
                me.x += dx * speed;
                if (me.x < 15 || me.x > canvas.width - 15 || checkObstacleCollision(me.x, me.y, 14)) me.x = oldX;
                
                me.y += dy * speed;
                if (me.y < 15 || me.y > canvas.height - 15 || checkObstacleCollision(me.x, me.y, 14)) me.y = oldY;
            }
        }

        function processRulesEngine() {
            let seeker = Object.values(players).find(p => p.seeker);
            if (!seeker) return;

            let hidersAlive = 0;
            let coneAngle = 0.65; 
            let coneDist = 180;

            Object.keys(players).forEach(k => {
                let p = players[k];
                if (p.seeker || p.caught) return;

                hidersAlive++;
                if (releaseCountdown > 0) return; 

                let hdx = p.x - seeker.x;
                let hdy = p.y - seeker.y;
                let dist = Math.hypot(hdx, hdy);
                
                let inCone = false;
                if (dist < coneDist) {
                    let angleToHider = Math.atan2(hdy, hdx);
                    let diff = Math.atan2(Math.sin(angleToHider - seeker.angle), Math.cos(angleToHider - seeker.angle));
                    if (Math.abs(diff) < coneAngle) {
                        if (!isLineOfSightBlocked(seeker.x, seeker.y, p.x, p.y)) inCone = true;
                    }
                }

                if (inCone) {
                    p.inConeTime += 1/60; 
                    if (p.inConeTime >= 1.5) p.caught = true;
                } else {
                    p.inConeTime = Math.max(0, p.inConeTime - 1/60);
                }
            });

            if (hidersAlive === 0) evaluateWinCondition(false); 
        }

        function evaluateWinCondition(timeRanOut) {
            clearInterval(timerInterval);
            let winner = timeRanOut ? "HIDERS" : "SEEKER";
            broadcast({ type: "end", winner });
            triggerEndGame(winner);
        }

        function triggerEndGame(winner) {
            gameRunning = false;
            document.getElementById("win-title").innerText = `${winner} WIN!`;
            document.getElementById("win-title").style.color = winner === "HIDERS" ? "#00adb5" : "#ff2e93";
            
            // Adjust label text dynamically if player is host
            document.getElementById("btn-rematch-request").innerText = (role === "host") ? "Return to Lobby" : "Request Return to Lobby";
            gameOverOverlay.style.display = "flex";
        }

        function renderGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let me = players[myId];
            if (!me) return;

            if (me.seeker && releaseCountdown === 0) {
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(me.x, me.y);
                ctx.arc(me.x, me.y, 180, me.angle - 0.65, me.angle + 0.65);
                ctx.closePath();
                ctx.clip();

                ctx.fillStyle = "#0c0c14";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                drawObstacles();
                drawGameEntities(true);
                ctx.restore();
            } else {
                ctx.fillStyle = (me.inConeTime > 0 && !me.seeker) ? `rgba(180, 20, 20, ${0.2 + (me.inConeTime / 1.5) * 0.5})` : "#0c0c14";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let seeker = Object.values(players).find(p => p.seeker);
                if (seeker && releaseCountdown === 0) {
                    ctx.save();
                    ctx.fillStyle = "rgba(255, 46, 147, 0.08)";
                    ctx.strokeStyle = "rgba(255, 46, 147, 0.3)";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(seeker.x, seeker.y);
                    ctx.arc(seeker.x, seeker.y, 180, seeker.angle - 0.65, seeker.angle + 0.65);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                drawObstacles();
                drawGameEntities(false);
            }
        }

        function drawObstacles() {
            obstacles.forEach(obs => {
                ctx.strokeStyle = "#4d2ab3";
                ctx.fillStyle = "#16102b";
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#4d2ab3";
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });
            ctx.shadowBlur = 0;
        }

        function drawGameEntities(isSeekerVision) {
            Object.values(players).forEach(p => {
                if (p.caught && isSeekerVision) return; 
                if (isSeekerVision && !p.seeker) {
                    let seeker = players[myId];
                    if (isLineOfSightBlocked(seeker.x, seeker.y, p.x, p.y)) return;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                let color = p.seeker ? "#ff2e93" : (p.caught ? "#444455" : "#00adb5");
                ctx.fillStyle = color;
                ctx.strokeStyle = color;
                ctx.shadowBlur = p.caught ? 0 : 10;
                ctx.shadowColor = color;

                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();

                if(!p.caught) {
                    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0); ctx.stroke();
                }

                ctx.restore();
                ctx.shadowBlur = 0;

                ctx.fillStyle = p.seeker ? "#ff2e93" : "#ffffff";
                ctx.font = "10px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y - 18);
            });
        }
    </script>
</body>
</html>
